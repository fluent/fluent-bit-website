<div class="fts-pack-grid">
  {{ range site.Data.fts.packs }}
    <a class="fts-pack-card" href="https://github.com/fluent/fluent-bit/blob/master/packs/fts/{{ .path }}/README.md">
      <span class="fts-pack-signal">{{ .signal }}</span>
      <h3>{{ .title }}</h3>
      <p>{{ .text }}</p>
      <span class="fts-pack-link">View policy <span aria-hidden="true">↗</span></span>
    </a>
  {{ end }}
</div>
