# Verified against fluent/fluent-bit 59a3ecea4867b85d0a6ec7e0eb51d34877683851 on 2026-11-05.
name = "FTS — Fluent Typed Scripting"
headline = "Shape your telemetry with Lua."
description = "Write policies for logs, metrics, and traces directly in Fluent Bit, with typed access to telemetry values and OpenTelemetry context."
quickstart = "https://github.com/fluent/fluent-bit/blob/master/plugins/processor_fts/README.md#quick-start"
reference = "https://github.com/fluent/fluent-bit/blob/master/plugins/processor_fts/README.md"
examples = "https://github.com/fluent/fluent-bit/blob/master/plugins/processor_fts/README.md#logs"
status = "Fluent Bit 5.2"
availability = "FTS is included in Fluent Bit 5.2. Use a build with the FTS processor enabled, and check your binary before running the quickstart."

[demo]
input = '{"id":9007199254740993,"password":"example-secret"}'
output = '{"id":9007199254740993,"password":"[REDACTED]","environment":"production"}'
policy = '''local fb = require("fluentbit")

function process(log)
  fb.redact(log.body, {"password"})
  log.body:set("environment", "production")
end'''

[[signals]]
id = "logs"
name = "Logs"
title = "Decode first. Redact what you intend."
text = "Unpack a declared JSON message into typed fields, then redact known keys. This policy drops records that cannot be decoded so their raw message is not forwarded."
note = "Key-based redaction only visits the value passed to it. Free-form text and other attribute maps need explicit policies."
code = '''local fb = require("fluentbit")

function process(log)
  if not fb.unpack_json(log, "message") then
    return fb.DROP
  end
  fb.redact(log.body, {"password", "authorization"})
end'''
[[signals]]
id = "metrics"
name = "Metrics"
title = "Use the dimensions that answer your questions."
text = "For a compatible request counter, keep route and status dimensions and deliberately combine matching series."
note = "Aggregation is within the current metric family and matching time windows. Resources and scopes remain distinct; this is not a global cardinality cap."
code = '''local fb = require("fluentbit")

function process(metric)
  if metric.name == "http.server.requests" then
    fb.aggregate_metric(metric,
      {"http.route", "http.response.status_code"}, "sum")
  end
end'''
[[signals]]
id = "traces"
name = "Traces"
title = "Change attributes. Keep the trace connected."
text = "Redact selected span attributes without rewriting trace IDs, span IDs, or parent relationships."
note = "Events, links, and resource attributes need their own operations. FTS sees one span per callback; use a sampling processor for whole-trace decisions."
code = '''local fb = require("fluentbit")

function process(span)
  fb.redact(span.attributes,
    {"password", "authorization"})
end'''
